name: Rolling source archive

on:
  push:

permissions:
  contents: write

concurrency:
  group: rolling-source-release
  cancel-in-progress: false

jobs:
  archive:
    # Only publish pushes to the repository's default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build trimmed source archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/repo-root.tar.gz"

          tar \
            --exclude='./.git' \
            --exclude='./kaitai' \
            --exclude='./test' \
            -czf "$ARCHIVE" \
            .

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Replace rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Remove the previous rolling release and its tag, if present.
          gh release delete snapshot --cleanup-tag --yes || true

          # Recreate it at exactly the commit that triggered this workflow.
          gh release create snapshot "$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "Latest trimmed source" \
            --notes "Automatically rebuilt from ${GITHUB_SHA}."
